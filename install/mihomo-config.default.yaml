# zKeen UI — default Mihomo config (no secrets)
# Subscription URL: set in onboarding or Settings → Subscription

redir-port: 1182
tproxy-port: 1181
mixed-port: 1080

tcp-concurrent: true
allow-lan: true
mode: rule
geo-auto-update: true
geo-update-interval: 168
log-level: silent
ipv6: false
external-controller: 0.0.0.0:9090
geodata-mode: true
profile:
  store-selected: true
  tracing: true
find-process-mode: "off"

sniffer:
  enable: true
  force-dns-mapping: true
  sniff:
    HTTP:
      ports: [80]
      override-destination: true
    TLS:
      ports: [443]
    QUIC:
      ports: [443]

proxy-providers:
  subscription:
    type: http
    url: ""
    path: ./proxy-providers/subscription.yaml
    interval: 0
    header:
      User-Agent:
        - "zkeen"
    health-check:
      enable: false
      url: http://www.msftncsi.com/ncsi.txt
      interval: 3000

proxies: []

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 208.67.222.222
    - 208.67.220.220
  nameserver:
    - https://dns10.quad9.net/dns-query
    - https://dns.aa.net.uk/dns-query
    - https://doh.opendns.com/dns-query
    - tls://dns.quad9.net
    - tls://1.1.1.1
    - tls://dns.opendns.com
  nameserver-policy:
    '+.supercell.net': 'https://dns.google/dns-query'
    '+.brawlestarsgame.com': 'https://dns.google/dns-query'
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.pool.ntp.org
    - +.msftconnecttest.com
    - +.3gppnetwork.org

